spring.application.name=healthcare-appointment-management-system

# ==========================================
# SERVER PORT CONFIGURATION
# ==========================================
server.port=${PORT:8080}

# ==========================================
# DATABASE CONNECTION CONFIGURATION
# ==========================================
# Database connection properties configured dynamically via environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# HIBERNATE / JPA CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SWAGGER / OPENAPI CONFIGURATION
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# JWT SECURITY CONFIGURATION
# ==========================================
# JWT secret key configured dynamically via environment variables
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# AI / CHATBOT CONFIGURATION
# ==========================================
ai.api.key=${AI_API_KEY:}
ai.api.url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
ai.api.model=${AI_MODEL:gpt-4o-mini}

# ==========================================
# WHATSAPP BUSINESS CLOUD API CONFIGURATION
# ==========================================
whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com/v19.0}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}

# ==========================================
# FOLLOW-UP REMINDER CONFIGURATION
# ==========================================
followup.reminder.days-before=${FOLLOWUP_REMINDER_DAYS_BEFORE:1}
app.scheduler.follow-up-reminder.rate=${FOLLOWUP_REMINDER_RATE:86400000}
app.scheduler.follow-up-reminder.initial-delay=${FOLLOWUP_REMINDER_INITIAL_DELAY:10000}


