spring.application.name=healthcare-appointment-management-system

# ==========================================
# DATABASE CONNECTION CONFIGURATION
# ==========================================
# We append '?createDatabaseIfNotExist=true' so that MySQL automatically creates the 'healthcare_db' if it doesn't exist.
#spring.datasource.url=jdbc:mysql://localhost:3306/healthcare_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
#spring.datasource.url=jdbc:mysql://localhost:3306/healthcare_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/healthcare_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#spring.datasource.username=root
# Change the password to match your local MySQL configuration
#spring.datasource.password=


spring.datasource.username=spring
spring.datasource.password=spring123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# HIBERNATE / JPA CONFIGURATION
# ==========================================
# Automatically validates and updates the database schema based on JPA Entity classes.
spring.jpa.hibernate.ddl-auto=update

# Print SQL queries in the console log
spring.jpa.show-sql=true

# Format the printed SQL to make it readable in the console
spring.jpa.properties.hibernate.format_sql=true

# Specify the MySQL Dialect so Hibernate generates optimized MySQL queries
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# SWAGGER / OPENAPI CONFIGURATION
# ==========================================
# Define the endpoints for Swagger documentation and Web UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# JWT SECURITY CONFIGURATION
# ==========================================
# 256-bit secure key represented as a Base64-encoded string
jwt.secret=ZmQ3ZGNkMDc0M2I5NDcxMGQxODc2NzdhMTFjYjg2YzA5YzVlOTM5ZTMzNjRiMjA3ZDU0ODFlMDc2Mzk1NzgxYQ==
# 24 hours in milliseconds (24 * 60 * 60 * 1000)
jwt.expiration=86400000

