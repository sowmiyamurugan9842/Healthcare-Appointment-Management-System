spring.application.name=healthcare-appointment-management-system

# ==========================================
# SERVER PORT CONFIGURATION
# ==========================================
# Railway dynamically assigns a PORT env var at runtime
server.port=${PORT:8080}

# ==========================================
# DATABASE CONNECTION CONFIGURATION (POSTGRESQL)
# ==========================================
# Supports DB_HOST/PGHOST, DB_PORT/PGPORT, DB_NAME/PGDATABASE, DB_USERNAME/PGUSER, DB_PASSWORD/PGPASSWORD
# with seamless fallback to Railway PostgreSQL variables (PGHOST, etc.) and safe local defaults.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${POSTGRES_URL:jdbc:postgresql://${DB_HOST:${PGHOST:localhost}}:${DB_PORT:${PGPORT:5432}}/${DB_NAME:${PGDATABASE:healthcare_db}}?sslmode=prefer}}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# HIBERNATE / JPA CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# CORS CONFIGURATION
# ==========================================
# Configurable production frontend URL (e.g., https://careportal-khaki.vercel.app)
app.cors.frontend-url=${FRONTEND_URL:}

# ==========================================
# SWAGGER / OPENAPI CONFIGURATION
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# JWT SECURITY CONFIGURATION
# ==========================================
# Secret key configured via environment variable (Base64-encoded 256-bit string)
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# AI / CHATBOT CONFIGURATION
# ==========================================
ai.api.key=${AI_API_KEY:}
ai.api.url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
ai.api.model=${AI_MODEL:gpt-4o-mini}

# ==========================================
# WHATSAPP BUSINESS CLOUD API CONFIGURATION
# ==========================================
whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com/v19.0}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}

# ==========================================
# SCHEDULER CONFIGURATION
# ==========================================
followup.reminder.days-before=${FOLLOWUP_REMINDER_DAYS_BEFORE:1}
app.scheduler.follow-up-reminder.rate=${FOLLOWUP_REMINDER_RATE:86400000}
app.scheduler.follow-up-reminder.initial-delay=${FOLLOWUP_REMINDER_INITIAL_DELAY:10000}
app.scheduler.appointment-expiry.rate=${APPOINTMENT_EXPIRY_RATE:3600000}
app.scheduler.appointment-expiry.initial-delay=${APPOINTMENT_EXPIRY_INITIAL_DELAY:5000}
app.scheduler.appointment-reminder.rate=${APPOINTMENT_REMINDER_RATE:60000}
app.scheduler.appointment-reminder.initial-delay=${APPOINTMENT_REMINDER_INITIAL_DELAY:5000}
app.scheduler.waitlist-expiry.rate=${WAITLIST_EXPIRY_RATE:60000}
app.scheduler.waitlist-expiry.initial-delay=${WAITLIST_EXPIRY_INITIAL_DELAY:10000}
